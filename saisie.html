<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Saisie</title><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;800&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="c.css"><script src="lib.js"></script></head><body class="p-saisie">
<div class="ph">
<div class="cv"><em>Saisie · 5 min</em><span>+</span></div>
<div class="pg">
<h1>Saisie</h1>
<div class="sub" id="sub"></div>
<div class="k">Aujourd’hui</div>
<div class="top1">
<div class="f"><label for="sp">Poids · lb</label><input id="sp" type="text" value="" readonly></div>
<div class="f"><label for="sk">Calories · total</label><input id="sk" type="text" value="" readonly></div>
<div class="f"><label for="spr">Protéines · g</label><input id="spr" type="text" value="" readonly></div>
</div>
<div class="tot"><div class="sub">Reste aujourd’hui</div><div style="text-align: right"><b id="reste"></b><br><span id="rbar"></span></div></div>
<div class="k">Habitudes</div>
<div class="top1" id="hab"></div>
</div>
</div>
<script>
__run(function () {
const iso = TODAY.toISOString().slice(0, 10);
const t = rows("journal").find((x) => x.Date && x.Date.start.slice(0, 10) === iso);
set("sub", JOURS[TODAY.getDay()].replace(".", "") + " " + TODAY.getDate() + " " + MOISL[TODAY.getMonth()] + (t && t.Bloc ? " · " + esc(t.Bloc) : ""));
$("sp").value = t && num(t["Poids (lb)"]) !== null ? fmt(t["Poids (lb)"], 1) : "—";
$("sk").value = t && num(t.kcal) !== null ? fmt(t.kcal) : "—";
$("spr").value = t && num(t["Protéines (g)"]) !== null ? fmt(t["Protéines (g)"]) : "—";
const k = t ? n0(t.kcal) : 0, p = t ? n0(t["Protéines (g)"]) : 0;
set("reste", fmt(Math.max(0, 2900 - k)) + " kcal · " + fmt(Math.max(0, 140 - p)) + " g");
set("rbar", bar(k / 2900) + " " + pct(k / 2900));
const H = ["Gym", "140 g de protéines", "30 min d'étude IFR", "Aucune dépense impulsive", "Couché avant 23 h"];
set("hab", H.map((h) => { const on = !!(t && t[h]); return `<label class="chk"><input type="checkbox" disabled${on ? " checked" : ""}><span${on ? ' class="done"' : ""}>${esc(h.replace("'", "’"))}</span></label>`; }).join(""));
});
</script>

</body></html>
